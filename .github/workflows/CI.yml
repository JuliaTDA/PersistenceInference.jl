name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Cancel in-progress runs of the same workflow on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.9'      # minimum supported
          - '1'        # latest stable 1.x
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      # Test against the JuliaTDA forks of TDARipserer and TDAPersistenceDiagrams by
      # `develop`ing them straight from their GitHub URLs before resolving.
      - name: Develop ecosystem packages
        run: |
          julia --project=. -e '
            using Pkg
            Pkg.develop([
              PackageSpec(url = "https://github.com/JuliaTDA/Ripserer.jl"),
              PackageSpec(url = "https://github.com/JuliaTDA/PersistenceDiagrams.jl"),
            ])
            Pkg.instantiate()'
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent inference numerical reference
        run: |
          pip install -r validation/requirements.txt
          julia --project=validation -e 'using Pkg; Pkg.develop([PackageSpec(url="https://github.com/JuliaTDA/PersistenceDiagrams.jl"),PackageSpec(url="https://github.com/JuliaTDA/Ripserer.jl"),PackageSpec(path=pwd())]); Pkg.instantiate()'
          julia --project=validation validation/export_reference.jl /tmp/inference-reference
          python validation/numpy_reference.py /tmp/inference-reference
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true
